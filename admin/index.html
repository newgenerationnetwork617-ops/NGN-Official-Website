<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b3b"><title>NGN Admin | Website Management</title>
<style>
:root{--navy:#071b3b;--blue:#174a83;--gold:#f2bd4b;--paper:#f4f7fb;--ink:#17263d;--muted:#69778c;--line:#e3e9f1}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 20px 55px #071b3b12}.brand{font-weight:900;color:var(--navy);letter-spacing:.04em}.brand small{display:block;color:var(--blue);letter-spacing:.15em;font-size:11px;margin-top:3px}.login-card h1{font-size:27px;line-height:1.15;margin:28px 0 8px;color:var(--navy)}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:15px 0}.field label{font-weight:700;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9e1ec;border-radius:11px;padding:12px 13px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#3975b7;box-shadow:0 0 0 3px #3975b71a}.field textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;background:var(--blue);color:#fff}.btn.gold{background:var(--gold);color:#17243a}.btn.ghost{background:#edf2f8;color:var(--navy)}.btn.danger{background:#fff0ef;color:#b42318}.btn:disabled{opacity:.6;cursor:wait}.full{width:100%}.error{color:#b42318;font-size:13px;min-height:20px}.app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:var(--navy);color:#fff;padding:25px 17px;display:flex;flex-direction:column;z-index:5}.sidebar .brand{color:#fff;padding:4px 10px 27px}.sidebar .brand small{color:var(--gold)}.nav-label{font-size:10px;letter-spacing:.18em;color:#93a8c5;padding:12px 12px 7px}.nav-btn{border:0;background:transparent;color:#d7e4f5;text-align:left;padding:12px;border-radius:10px;margin:2px 0;font-weight:700}.nav-btn.active,.nav-btn:hover{background:#ffffff18;color:#fff}.sidebar-bottom{margin-top:auto}.main{margin-left:250px;padding:32px;max-width:1450px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.topbar h1{margin:0;color:var(--navy);font-size:29px}.topbar p{margin:5px 0 0;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;margin-bottom:20px;box-shadow:0 8px 25px #102b4b08}.panel h2{margin:0 0 6px;color:var(--navy);font-size:19px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.stat strong{display:block;color:var(--navy);font-size:27px}.stat span{color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.span-2{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item strong{display:block;color:var(--navy)}.item small{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}.pill{display:inline-block;background:#eaf2fc;color:#174a83;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800}.mobile-head{display:none}
@media(max-width:850px){.sidebar{width:76px;padding:18px 9px}.sidebar .brand{font-size:0;padding:6px}.sidebar .brand small{display:none}.nav-label{display:none}.nav-btn{font-size:0;text-align:center;padding:13px 4px}.nav-btn:before{content:attr(data-icon);font-size:18px}.sidebar-bottom .nav-btn{font-size:11px}.main{margin-left:76px;padding:22px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.sidebar{position:sticky;top:0;bottom:auto;width:100%;height:auto;min-height:64px;flex-direction:row;align-items:center;justify-content:space-around;padding:7px;overflow:auto}.sidebar .brand,.nav-label,.sidebar-bottom{display:none}.nav-btn{min-width:52px;margin:0}.main{margin:0;padding:17px}.topbar{align-items:flex-start}.topbar h1{font-size:23px}.topbar .btn{padding:10px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:23px}.panel{padding:17px}.item{align-items:flex-start}.item .actions{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap"><div class="login-card">
<div class="brand">NEW GENERATION NETWORK<small>WEBSITE ADMINISTRATION</small></div>
<h1 id="accessTitle">Opening dashboard…</h1><p class="muted" id="loginError">Checking your existing administrator session.</p>
</div></div>
<div id="appView" class="app">
<aside class="sidebar"><div class="brand">NEW GENERATION NETWORK<small>WEBSITE ADMIN</small></div><div class="nav-label">MANAGEMENT</div>
<button class="nav-btn active" data-tab="overview" data-icon="⌂">Overview</button>
<button class="nav-btn" data-tab="app" data-icon="↓">App releases</button>
<button class="nav-btn" data-tab="devotions" data-icon="✦">Devotionals</button>
<button class="nav-btn" data-tab="teachings" data-icon="▶">Teachings</button>
<button class="nav-btn" data-tab="books" data-icon="▤">Books</button>
<button class="nav-btn" data-tab="events" data-icon="▣">Events</button>
<div class="sidebar-bottom"><button class="nav-btn" id="signOutBtn" data-icon="↪">Sign out</button></div></aside>
<main class="main"><div class="topbar"><div><h1 id="pageTitle">Overview</h1><p>Manage what visitors see on the NGN official website.</p></div><a class="btn ghost" href="/" target="_blank" rel="noopener">View website ↗</a></div><div id="content"></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://nlhjxoevyatvxstxgnhs.supabase.co';
const SUPABASE_KEY='sb_publishable_QiReFPxygdWtOlRy5Eol6Q_uuubGD7j';
let supabase;
async function getSupabase(){
 if(supabase)return supabase;
 if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('The sign-in library did not load. Check your connection and reload this page.');
 supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 return supabase;
}
const BUCKET='ngn-website-media';
const configs={
 app:{title:'App releases',table:'website_app_releases',fields:[['version','Version number','text',true],['release_notes','Release notes','textarea'],['apk','APK file (up to 50 MB)','file'],['apk_url','APK download link (GitHub Release or Google Drive)','url']],fileField:'apk',fileColumn:'apk_path',fileNameColumn:'apk_file_name',accept:'.apk,application/vnd.android.package-archive',publishLabel:'Publish release',summary:r=>'Version '+r.version+' · '+(r.apk_file_name||(r.apk_url?'External APK link':'APK'))},
 devotions:{title:'Devotionals',table:'website_devotionals',fields:[['devotional_date','Devotional date','date',true],['title','Title','text',true],['scripture_reference','Scripture reference','text'],['body','Devotional message','textarea',true],['prayer','Prayer','textarea'],['cover','Cover image','file']],fileField:'cover',fileColumn:'cover_path',accept:'image/*',publishLabel:'Publish devotional',summary:r=>r.title+' · '+(r.devotional_date||'')},
 teachings:{title:'Teachings',table:'website_teachings',fields:[['title','Teaching title','text',true],['speaker','Speaker','text'],['description','Description','textarea'],['youtube_url','YouTube link','url'],['media_url','Audio / video / PDF link','url'],['thumbnail','Thumbnail image','file']],fileField:'thumbnail',fileColumn:'thumbnail_path',accept:'image/*',publishLabel:'Publish teaching',summary:r=>r.title+' · '+(r.speaker||'NGN')},
 books:{title:'Books & resources',table:'website_books',fields:[['title','Book / resource title','text',true],['author','Author','text'],['description','Description','textarea'],['file','PDF file','file',true],['cover','Cover image','file']],fileField:'file',fileColumn:'file_path',fileNameColumn:'file_name',accept:'.pdf,application/pdf',publishLabel:'Publish resource',summary:r=>r.title+' · '+(r.author||'NGN resource')},
 events:{title:'Events & flyers',table:'website_events',fields:[['title','Event title','text',true],['starts_at','Date and time','datetime-local'],['venue','Venue','text'],['description','Description','textarea'],['flyer','Event flyer','file']],fileField:'flyer',fileColumn:'flyer_path',accept:'image/*',publishLabel:'Publish event',summary:r=>r.title+' · '+(r.venue||'NGN event')}
};
let activeTab='overview',currentUser=null;
const $=id=>document.getElementById(id);
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function publicUrl(path){return supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;}
async function verifyAdmin(user){const client=await getSupabase();const {data,error}=await client.from('admin_members').select('user_id').eq('user_id',user.id).maybeSingle();if(error)throw error;return !!data;}
async function showApp(user){currentUser=user||null;$('loginView').style.display='none';$('appView').style.display='block';await renderTab('overview');}
async function boot(){try{await getSupabase();await showApp(null);}catch(err){$('loginView').style.display='grid';$('accessTitle').textContent='Dashboard unavailable';$('loginError').textContent='Could not load the dashboard: '+(err?.message||'Check your internet connection and reload.');}}
$('signOutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();location.reload();});
document.querySelectorAll('.nav-btn[data-tab]').forEach(b=>b.addEventListener('click',()=>renderTab(b.dataset.tab)));
async function count(table){const {count,error}=await supabase.from(table).select('*',{count:'exact',head:true});return error?0:(count||0);}
async function renderTab(tab){activeTab=tab;document.querySelectorAll('.nav-btn[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('pageTitle').textContent=tab==='overview'?'Overview':configs[tab].title;
if(tab==='overview'){const keys=Object.keys(configs);const counts=await Promise.all(keys.map(k=>count(configs[k].table)));$('content').innerHTML='<div class="stats">'+keys.map((k,i)=>'<div class="stat"><strong>'+counts[i]+'</strong><span>'+configs[k].title+'</span></div>').join('')+'</div><div class="panel" style="margin-top:18px"><h2>Website publishing centre</h2><p class="muted">Upload the latest Android APK, publish devotionals, add teachings, share PDF resources, and announce upcoming events. Published content becomes visible on the public website.</p><div class="actions"><button class="btn gold" data-jump="app">Upload new APK</button><button class="btn ghost" data-jump="devotions">Add devotional</button></div></div><div class="panel"><h2>Administrator account</h2><p class="muted">'+safe(currentUser.email)+' · Verified NGN administrator</p></div>';$('content').querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>renderTab(b.dataset.jump)));return;}
const c=configs[tab];$('content').innerHTML='<div class="panel"><h2>Add new content</h2><p class="muted">Complete the details below. You can save it as a draft or publish it for website visitors.</p><form id="itemForm"><div class="form-grid">'+c.fields.map(f=>'<div class="field '+(f[2]==='textarea'?'span-2':'')+'"><label>'+safe(f[1])+(f[3]?' *':'')+'</label>'+(f[2]==='textarea'?'<textarea name="'+f[0]+'" '+(f[3]?'required':'')+'></textarea>':'<input name="'+f[0]+'" type="'+(f[2]==='file'?'file':f[2])+'" '+(f[2]==='file'?'accept="'+(f[0]===c.fileField?c.accept:(f[0]==='cover'||f[0]==='thumbnail'||f[0]==='flyer'?'image/*':c.accept))+'"':'')+' '+(f[3]?'required':'')+' >')+'</div>').join('')+'</div><div class="actions"><button class="btn gold" type="submit" id="publishBtn">'+c.publishLabel+'</button><button class="btn ghost" type="button" id="draftBtn">Save draft</button></div><div class="status" id="formStatus"></div></form></div><div class="panel"><h2>Published and draft content</h2><div id="itemsList" class="empty">Loading…</div></div>';
$('itemForm').addEventListener('submit',e=>saveItem(e,true));$('draftBtn').addEventListener('click',()=>saveItem(null,false));await loadItems(tab);}
async function loadItems(tab){const c=configs[tab];const {data,error}=await supabase.from(c.table).select('*').order('created_at',{ascending:false}).limit(50);const list=$('itemsList');if(error){list.textContent='Could not load content: '+error.message;return;}if(!data.length){list.innerHTML='<div class="empty">Nothing here yet. Add your first item above.</div>';return;}list.innerHTML=data.map(r=>'<div class="item"><div><strong>'+safe(c.summary(r))+'</strong><small>'+(r.is_published?'<span class="pill">Published</span>':'<span class="pill">Draft</span>')+' · '+new Date(r.created_at).toLocaleDateString()+'</small></div><div class="actions"><button class="btn ghost" data-toggle="'+r.id+'" data-pub="'+(!r.is_published)+'">'+(r.is_published?'Unpublish':'Publish')+'</button><button class="btn danger" data-delete="'+r.id+'">Delete</button></div></div>').join('');list.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>toggleItem(tab,b.dataset.toggle,b.dataset.pub==='true')));list.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteItem(tab,b.dataset.delete)));}
async function uploadFile(file,folder){if(!file)return null;if(file.size>50*1024*1024)throw new Error('This file is '+(file.size/1024/1024).toFixed(1)+' MB. The current Supabase Free upload limit is 50 MB. Upload this APK to a GitHub Release, then paste its direct .apk download URL in the field above.');const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=folder+'/'+Date.now()+'-'+crypto.randomUUID()+'-'+clean;const {error}=await supabase.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(error)throw error;return path;}
async function saveItem(event,publish){if(event)event.preventDefault();const c=configs[activeTab],form=$('itemForm'),btn=$('publishBtn'),status=$('formStatus');btn.disabled=true;const draftBtn=$('draftBtn');if(draftBtn)draftBtn.disabled=true;status.textContent='Preparing release…';try{const fd=new FormData(form),record={is_published:publish,published_at:publish?new Date().toISOString():null};for(const [k,v] of fd.entries()){if(v instanceof File){if(!v.name)continue;if(activeTab==='app'&&k==='apk'&&String(fd.get('apk_url')||'').trim())continue;const col=k===c.fileField?c.fileColumn:(k==='cover'?'cover_path':k==='thumbnail'?'thumbnail_path':k==='flyer'?'flyer_path':null);if(col){record[col]=await uploadFile(v,activeTab);if(activeTab==='app'&&k==='apk'){record.apk_file_name=v.name;record.file_size_bytes=v.size;}}}else if(v!==''){record[k]=k==='starts_at'?new Date(v).toISOString():v;}}if(activeTab==='app'){const link=String(fd.get('apk_url')||'').trim();if(link){let parsed;try{parsed=new URL(link)}catch{throw new Error('Enter a valid HTTPS APK or Google Drive link.')}if(parsed.protocol!=='https:')throw new Error('The APK link must use HTTPS.');if(parsed.hostname==='drive.google.com'){let fileId='';const pathParts=parsed.pathname.split('/');if(pathParts[1]==='file'&&pathParts[2]==='d')fileId=pathParts[3]||'';else if(parsed.pathname==='/uc')fileId=parsed.searchParams.get('id')||'';if(!/^[A-Za-z0-9_-]{10,}$/.test(fileId))throw new Error('This Google Drive link is not recognised. Copy the file sharing link from Drive and try again.');record.apk_url='https://drive.google.com/uc?export=download&id='+encodeURIComponent(fileId);}else if(parsed.pathname.toLowerCase().endsWith('.apk')){record.apk_url=link;}else{throw new Error('Use a direct HTTPS .apk link or a Google Drive file-sharing link.');}}if(!record.apk_path&&!record.apk_url)throw new Error('Choose an APK under 50 MB or enter a direct APK download URL.');if(record.apk_path&&record.apk_url)throw new Error('Use either an uploaded APK file or a direct APK URL, not both.');}if(activeTab==='books'&&!record.file_path)throw new Error('Please choose the PDF file.');if(activeTab==='app'&&record.apk_path){record.apk_file_name=fd.get('apk').name;record.file_size_bytes=fd.get('apk').size;}const {error}=await supabase.from(c.table).insert(record);if(error)throw error;status.textContent=publish?'Published successfully. It is now available on the public website.':'Draft saved successfully.';form.reset();await loadItems(activeTab);}catch(err){status.textContent='Could not save: '+err.message;}finally{btn.disabled=false;if(draftBtn)draftBtn.disabled=false;}}
async function toggleItem(tab,id,publish){const c=configs[tab];const {error}=await supabase.from(c.table).update({is_published:publish,published_at:publish?new Date().toISOString():null}).eq('id',id);if(error)alert(error.message);else await loadItems(tab);}
async function deleteItem(tab,id){if(!confirm('Delete this item from the website?'))return;const {error}=await supabase.from(configs[tab].table).delete().eq('id',id);if(error)alert(error.message);else await loadItems(tab);}
boot();
</script>
</body></html>
